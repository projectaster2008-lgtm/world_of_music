<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Space Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="70%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#040303" />
    </radialGradient>

    <!-- Golden Vinyl Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Celestial Orbital Ring -->
    <linearGradient id="orbitGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85" />
    </linearGradient>

    <!-- Center Label Gradient -->
    <radialGradient id="centerLabel" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="45%" stop-color="#fde68a" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Sheen Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic Disc Base -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="url(#goldRim)" stroke-width="1.5" />

  <!-- Micro Vinyl Sound Grooves -->
  <circle cx="32" cy="32" r="26" stroke="#44403c" stroke-width="0.75" stroke-dasharray="3 1.5" opacity="0.6" />
  <circle cx="32" cy="32" r="22.5" stroke="#292524" stroke-width="0.6" opacity="0.8" />
  <circle cx="32" cy="32" r="19" stroke="#57534e" stroke-width="0.6" stroke-dasharray="5 2" opacity="0.5" />
  <circle cx="32" cy="32" r="15.5" stroke="#292524" stroke-width="0.5" opacity="0.7" />

  <!-- Cosmic Orbit Ring Tilt (Saturn / Celestial Astrolabe Ring) -->
  <ellipse cx="32" cy="32" rx="29" ry="11" transform="rotate(-28 32 32)" stroke="url(#orbitGlow)" stroke-width="1.4" opacity="0.85" filter="url(#glow)" />

  <!-- Orbit Planetary Sparkle -->
  <circle cx="56" cy="20" r="2" fill="#fde68a" filter="url(#glow)" />
  <circle cx="8" cy="44" r="1.5" fill="#f43f5e" opacity="0.9" />

  <!-- Vinyl Center Record Label -->
  <circle cx="32" cy="32" r="11" fill="url(#centerLabel)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="32" cy="32" r="9.5" stroke="#92400e" stroke-width="0.5" stroke-dasharray="1 1" opacity="0.6" />

  <!-- Center Spindle Hole -->
  <circle cx="32" cy="32" r="3.2" fill="#0c0a09" stroke="#fef3c7" stroke-width="0.8" />
  <circle cx="32" cy="32" r="1.2" fill="#f59e0b" />

  <!-- Constellation Accent Stars (Ating Universe) -->
  <path d="M19 15 L20 18 L23 19 L20 20 L19 23 L18 20 L15 19 L18 18 Z" fill="#fef08a" opacity="0.9" filter="url(#glow)" />
  <path d="M46 45 L46.6 47 L49 47.6 L46.6 48.2 L46 50 L45.4 48.2 L43 47.6 L45.4 47 Z" fill="#38bdf8" opacity="0.8" />
</svg>
