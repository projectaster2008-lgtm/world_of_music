    <!-- Background Audio & Tab-Exit Playback Persistence Interceptor -->
    <script>
      (function() {
        try {
          var realHiddenDesc = Object.getOwnPropertyDescriptor(Document.prototype, 'hidden');
          var realVisDesc = Object.getOwnPropertyDescriptor(Document.prototype, 'visibilityState');
          window.__realDocumentHidden = function() {
            try {
              return realHiddenDesc && realHiddenDesc.get ? realHiddenDesc.get.call(document) : false;
            } catch(e) {
              return false;
            }
          };

          // Override Document visibility properties so third-party players (like YouTube)
          // never detect tab exits, minimizing, or background switching.
          Object.defineProperty(Document.prototype, 'hidden', {
            get: function() { return false; },
            configurable: true
          });
          Object.defineProperty(Document.prototype, 'visibilityState', {
            get: function() { return 'visible'; },
            configurable: true
          });
          Object.defineProperty(Document.prototype, 'webkitHidden', {
            get: function() { return false; },
            configurable: true
          });
          Object.defineProperty(Document.prototype, 'webkitVisibilityState', {
            get: function() { return 'visible'; },
            configurable: true
          });
          Document.prototype.hasFocus = function() { return true; };

          // Intercept visibilitychange events at capture phase to prevent auto-pause scripts
          var stopVisEvent = function(e) {
            if (e && e.stopImmediatePropagation) {
              e.stopImmediatePropagation();
            }
          };
          window.addEventListener('visibilitychange', stopVisEvent, true);
          document.addEventListener('visibilitychange', stopVisEvent, true);
          window.addEventListener('webkitvisibilitychange', stopVisEvent, true);
          document.addEventListener('webkitvisibilitychange', stopVisEvent, true);
        } catch(err) {
          // ignore
        }
      })();
    </script>
